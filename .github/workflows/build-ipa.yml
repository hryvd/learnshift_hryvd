name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      pitch_mode:
        description: 'Build Pitch variant (com.learnshift.pitch)'
        type: boolean
        required: false
        default: false
      export_method:
        description: 'IPA packaging mode (auto uses signed if secrets exist, else unsigned)'
        type: choice
        required: false
        default: 'auto'
        options:
          - auto
          - unsigned
          - ad-hoc
          - app-store-connect
          - development
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'LearnShift-release.apk'
    tags:
      - 'v*'

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build LearnShift IPA
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Restore CocoaPods cache
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Install npm dependencies
        run: npm ci

      - name: Configure public Supabase env for bundle
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "EXPO_PUBLIC_SUPABASE_URL=${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}"
            echo "EXPO_PUBLIC_SUPABASE_KEY=${{ secrets.EXPO_PUBLIC_SUPABASE_KEY || vars.EXPO_PUBLIC_SUPABASE_KEY }}"
            if [ "${{ inputs.pitch_mode }}" = "true" ]; then
              echo "EXPO_PUBLIC_PITCH=1"
            fi
          } > .env

      - name: Determine signing mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          REQUESTED="${{ inputs.export_method || 'auto' }}"
          HAS_CERT="${{ secrets.BUILD_CERTIFICATE_BASE64 != '' && secrets.P12_PASSWORD != '' && secrets.BUILD_PROVISION_PROFILE_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}"
          if [ "$REQUESTED" != "unsigned" ] && [ "$HAS_CERT" = "true" ]; then
            if [ "$REQUESTED" = "auto" ]; then
              METHOD="ad-hoc"
            else
              METHOD="$REQUESTED"
            fi
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "export_method=$METHOD" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "export_method=unsigned" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare ephemeral iOS CI autolinking config
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID || '' }}
        run: node scripts/prepare-ios-ci.mjs --ci

      - name: Prebuild native iOS project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || vars.APPLE_TEAM_ID || '' }}
          EXPO_PUBLIC_PITCH: ${{ inputs.pitch_mode == true && '1' || '' }}
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Configure Xcode Node binary and Podfile signing settings
        shell: bash
        run: |
          set -euo pipefail
          NODE_BIN="$(command -v node)"
          echo "export NODE_BINARY=\"$NODE_BIN\"" > ios/.xcode.env.local

          if [ "${{ steps.mode.outputs.signed }}" != "true" ]; then
            node -e '
              const fs = require("fs");
              const podfilePath = "ios/Podfile";
              let text = fs.readFileSync(podfilePath, "utf8");
              const snippet = [
                "",
                "    installer.pods_project.targets.each do |target|",
                "      target.build_configurations.each do |config|",
                "        config.build_settings[\"CODE_SIGNING_ALLOWED\"] = \"NO\"",
                "        config.build_settings[\"CODE_SIGNING_REQUIRED\"] = \"NO\"",
                "      end",
                "    end"
              ].join("\n");
              if (text.includes("post_install do |installer|")) {
                text = text.replace(/post_install do \|installer\|/, "post_install do |installer|" + snippet);
              } else {
                text += "\npost_install do |installer|" + snippet + "\nend\n";
              }
              fs.writeFileSync(podfilePath, text, "utf8");
            '
          fi

      - name: Install CocoaPods dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd ios
          pod install || pod install --repo-update

      - name: Build unsigned IPA (sideload-ready)
        if: steps.mode.outputs.signed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          echo "Building workspace=$WORKSPACE scheme=$SCHEME (unsigned Release)"

          LOG_FILE="xcodebuild-unsigned.log"
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build/DerivedData \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build > "$LOG_FILE" 2>&1
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::xcodebuild failed (last 160 lines):"
            tail -n 160 "$LOG_FILE"
            exit "$STATUS"
          fi

          APP_PATH="$(find ios/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "::error::Built .app bundle not found in DerivedData"
            exit 1
          fi

          if [ ! -f "$APP_PATH/Info.plist" ]; then
            echo "::error::Missing Info.plist in $APP_PATH"
            exit 1
          fi

          if [ ! -f "$APP_PATH/main.jsbundle" ] && [ ! -d "$APP_PATH/EXUpdates.bundle" ]; then
            echo "::error::Missing embedded JS bundle in $APP_PATH"
            ls -la "$APP_PATH"
            exit 1
          fi

          rm -rf build-ipa LearnShift.ipa
          mkdir -p build-ipa/Payload
          cp -R "$APP_PATH" build-ipa/Payload/
          APP_BASENAME="$(basename "$APP_PATH")"
          codesign --force --deep --sign - "build-ipa/Payload/$APP_BASENAME"
          (cd build-ipa && zip -qry ../LearnShift.ipa Payload)

      - name: Build and export signed IPA
        if: steps.mode.outputs.signed == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'learnshift-ci-temp-keychain' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          TEMP_DIR="$(mktemp -d)"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          CERT_PATH="$TEMP_DIR/cert.p12"
          PROFILE_PATH="$TEMP_DIR/profile.mobileprovision"

          cleanup() {
            security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1 || true
            rm -rf "$TEMP_DIR"
          }
          trap cleanup EXIT

          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PLIST="$TEMP_DIR/profile.plist"
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          BUNDLE_ID="$(node -e 'console.log(require("./app.json").expo.ios.bundleIdentifier)')"
          if [ "${{ inputs.pitch_mode }}" = "true" ]; then
            BUNDLE_ID="com.learnshift.pitch"
          fi

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${{ steps.mode.outputs.export_method }}</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_UUID}</string>
            </dict>
          </dict>
          </plist>
          PLIST

          WORKSPACE="$(find ios -maxdepth 1 -name '*.xcworkspace' | head -n 1)"
          SCHEME="$(basename "$WORKSPACE" .xcworkspace)"
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/LearnShift.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive

          rm -rf build-ipa LearnShift.ipa
          xcodebuild \
            -exportArchive \
            -archivePath ios/build/LearnShift.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build-ipa

          EXPORTED_IPA="$(find build-ipa -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$EXPORTED_IPA" ]; then
            echo "::error::Exported .ipa not found in build-ipa"
            exit 1
          fi
          mv "$EXPORTED_IPA" ./LearnShift.ipa

      - name: Verify IPA package and write summary
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f LearnShift.ipa ]; then
            echo "::error::LearnShift.ipa was not created"
            exit 1
          fi
          SIZE_BYTES="$(stat -f%z LearnShift.ipa)"
          if [ "$SIZE_BYTES" -lt 5000000 ]; then
            echo "::error::LearnShift.ipa looks too small ($SIZE_BYTES bytes)"
            exit 1
          fi
          echo "LearnShift.ipa size: $SIZE_BYTES bytes"
          unzip -l LearnShift.ipa | head -n 30

          {
            echo "### LearnShift iOS IPA Build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Packaging mode | \`${{ steps.mode.outputs.export_method }}\` |"
            echo "| IPA size | \`${SIZE_BYTES}\` bytes |"
            echo "| Artifact name | \`LearnShift-ipa\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload LearnShift IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LearnShift-ipa
          path: LearnShift.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach IPA to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: LearnShift.ipa
